spring.application.name=ecommerce-api
# Configurações de conexão com o Banco de Dados H2
spring.datasource.url=jdbc:h2:mem:ecommercedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configurações do Spring Data JPA (responsável por criar as tabelas automaticamente)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Habilitar o painel visual do banco de dados no navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console